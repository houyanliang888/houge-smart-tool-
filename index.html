<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>户型智能点位自测 · 侯哥全屋智能</title>
<style>
  :root{
    --bg:#0f1b2e; --card:#182b45; --ink:#f2f0ec; --sub:#a3aec0; --muted:#74829a;
    --brand:#e87e31; --brand2:#4ecdc4; --warn:#ff6b6b; --line:#2a3f5c;
    --ok:#5cc89e; --soft:#233553; --shadow:0 4px 22px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;}
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 90px;}
  header{text-align:center;padding:22px 0 10px;}
  .hero{font-size:44px;margin-bottom:6px;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  header h1{margin:0;font-size:26px;letter-spacing:.5px;}
  header p{margin:10px auto 0;color:var(--sub);font-size:14px;max-width:560px;}
  .badge{display:inline-block;background:var(--brand);color:#fff;font-size:11px;
    padding:3px 11px;border-radius:20px;margin-bottom:8px;}

  .step{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px 18px;margin:18px 0;box-shadow:var(--shadow);}
  .step h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px;}
  .step h2 .n{background:linear-gradient(135deg,var(--brand),#f39c4d);color:#fff;width:26px;height:26px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
  .hint{font-size:12.5px;color:var(--sub);margin:-4px 0 12px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;}
  .field{position:relative;}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;}
  .field .ic{position:absolute;left:10px;bottom:10px;font-size:16px;opacity:.7;}
  .field input,.field select{width:100%;padding:9px 10px 9px 34px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;background:#0f1b2e;color:var(--ink);transition:.15s;}
  .field select{padding-left:10px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,126,49,.18);}

  .mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .mod{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;
    padding:12px;cursor:pointer;background:#132238;transition:.15s;user-select:none;}
  .mod:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow);}
  .mod input{display:none;}
  .mod .ico{width:30px;height:30px;color:var(--ink);transition:.2s;}
  .mod .txt{flex:1;}
  .mod .t{font-size:14px;font-weight:700;display:block;}
  .mod .d{font-size:11px;color:var(--sub);display:block;margin-top:2px;}
  .mod .check{width:20px;height:20px;border:2px solid var(--line);border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:12px;color:#fff;transition:.15s;}
  .mod:has(input:checked){border-color:var(--brand);background:rgba(232,126,49,.10);}
  .mod:has(input:checked) .check{background:var(--brand);border-color:var(--brand);}
  .mod:has(input:checked) .ico{color:var(--brand);filter:drop-shadow(0 0 6px rgba(232,126,49,.45));transform:scale(1.08);}

  .btn{display:block;width:100%;padding:15px;background:linear-gradient(135deg,var(--brand),#f39c4d);color:#fff;
    border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;margin:20px 0;
    letter-spacing:.5px;box-shadow:0 6px 18px rgba(232,126,49,.35);transition:.15s;position:relative;overflow:hidden;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(232,126,49,.45);}
  .btn:active{transform:translateY(1px);}

  .upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .upload label.file{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;background:var(--brand2);color:#0f1b2e;
    border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;}
  .upload label.file:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
  .upload input{display:none;}
  .upload .tip{font-size:12.5px;color:var(--sub);}

  /* 平面图标注 */
  .plan-wrap{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#101d30;}
  .plan-canvas{position:relative;line-height:0;touch-action:none;}
  .plan-canvas img{width:100%;display:block;}
  .plan-canvas .marker{position:absolute;transform:translate(-50%,-50%);color:#fff;width:30px;height:30px;
    cursor:grab;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6));user-select:none;z-index:2;}
  .plan-canvas .marker svg{width:100%;height:100%;color:#fff;filter:drop-shadow(0 0 3px rgba(232,126,49,.9));}
  .plan-canvas .marker:active{cursor:grabbing;}
  .plan-tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--card);}
  .tool{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#132238;border-radius:10px;
    padding:7px 11px;font-size:13px;cursor:pointer;transition:.15s;color:var(--ink);}
  .tool svg{width:18px;height:18px;}
  .tool.active{border-color:var(--brand);background:rgba(232,126,49,.15);color:#fff;font-weight:700;}
  .tool.active svg{color:var(--brand);}
  .tool.erase.active{background:#3a1d22;border-color:var(--warn);color:#fff;}
  .plan-foot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);background:var(--card);}
  .plan-foot button{border:1px solid var(--line);background:#0f1b2e;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink);cursor:pointer;}
  .plan-foot .count{margin-left:auto;font-weight:700;color:var(--ink);}

  /* 结果区 */
  #result{animation:fadeIn .6s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .empty{color:var(--sub);text-align:center;padding:34px 20px;font-size:14px;background:var(--card);border-radius:16px;border:1px dashed var(--line);}

  .summary{background:linear-gradient(135deg,var(--card),#1e3350);color:#fff;border-radius:16px;padding:18px;margin:12px 0 18px;box-shadow:var(--shadow);border:1px solid var(--line);}
  .summary-top{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;}
  .summary-top .num{font-size:26px;font-weight:800;display:block;line-height:1.1;color:var(--brand);}
  .summary-top .lab{font-size:11px;color:var(--sub);margin-top:4px;}
  .summary-bars{margin-top:14px;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12px;margin:8px 0;}
  .bar-row span{min-width:78px;color:var(--sub);}
  .bar{flex:1;height:10px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:10px;background:var(--brand);transition:width 1s cubic-bezier(.22,1,.36,1);}
  .bar-row .val{min-width:42px;text-align:right;font-weight:700;color:#fff;}

  .plan-result{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:16px 0;box-shadow:var(--shadow);}
  .plan-result h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;}
  .plan-result .ph{font-size:12.5px;color:var(--sub);margin:0 0 10px;}

  .room{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;
    box-shadow:var(--shadow);animation:slideUp .5s ease both;opacity:0;}
  @keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
  .room h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;}
  .room h3 .ric{font-size:22px;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .room h3 .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;}
  .item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;margin:8px 0;
    background:var(--soft);border-radius:12px;border:1px solid transparent;transition:.15s;}
  .item .i-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;background:#1a3151;}
  .item .i-ico svg{width:20px;height:20px;color:#fff;}
  .item .txt{flex:1;}
  .item .txt b{font-size:14px;font-weight:600;display:block;}
  .item .txt .sub{font-size:12px;color:var(--sub);margin-top:3px;}
  .tag{align-self:center;font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .tag.early{background:#3a1d22;color:var(--warn);}
  .tag.any{background:#173b33;color:var(--ok);}

  .pit{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0;box-shadow:var(--shadow);}
  .pit h3{margin:0 0 10px;color:var(--brand);font-size:15px;display:flex;align-items:center;gap:8px;}
  .pit-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08);}
  .pit-row:last-child{border:none;}
  .pit-row .p-ico{font-size:18px;flex-shrink:0;margin-top:1px;}
  .pit-row .p-txt{font-size:13.5px;color:var(--ink);}

  .actions{display:flex;gap:10px;margin:18px 0;}
  .actions button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--brand);
    background:transparent;color:var(--brand);font-size:14px;font-weight:700;cursor:pointer;transition:.15s;}
  .actions button.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .actions button:hover{transform:translateY(-1px);box-shadow:var(--shadow);}

  .hook{background:#0c1625;border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center;margin-top:24px;box-shadow:var(--shadow);}
  .hook h3{margin:0 0 8px;color:var(--brand);font-size:17px;}
  .hook p{margin:6px 0;font-size:14px;color:var(--sub);}
  .hook .wx{font-size:15px;color:#f0c89a;font-weight:700;}
  .qr{width:130px;height:130px;border-radius:12px;border:4px solid #fff;background:#fff;margin:12px auto 0;display:block;}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}

  @media(max-width:640px){
    .summary-top{grid-template-columns:repeat(2,1fr);}
    .mods{grid-template-columns:repeat(2,1fr);}
    .grid{grid-template-columns:repeat(2,1fr);}
  }
  @media print{
    body{background:#fff;color:#222;}
    .step,.btn,.actions,header p{display:none !important;}
    .wrap{max-width:100%;padding:0;background:#fff;}
    .room,.pit,.plan-result,.hook{break-inside:avoid;box-shadow:none;border:1px solid #ccc;background:#fff;}
    .hook{background:#f8f8f8;border:1px solid #ddd;}
    .item{background:#f4f4f4;}
    .item .i-ico{background:#fff;border:1px solid #ccc;}
    .item .i-ico svg{color:#222;}
    .summary{background:#fff;border:1px solid #ddd;}
    .summary-top .num{color:var(--brand);}
    .bar i{background:var(--brand);}
    .plan-canvas .marker svg{color:#222;filter:none;}
    .tag.early{background:#fdecea;color:#c0392b;}
    .tag.any{background:#eaf4ee;color:#27ae60;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="badge">侯哥全屋智能 · 长治本地</span>
    <div class="hero">🏠⚡</div>
    <h1>户型智能点位自测</h1>
    <p>填户型、勾模块、上传平面图——3 分钟拿到「智能点位清单 + 图上设备标注」，水电开工前不看，后期加一个都贵</p>
  </header>

  <div class="step">
    <h2><span class="n">1</span>说说你家户型</h2>
    <div class="grid">
      <div class="field"><label>卧室数量</label><span class="ic">🛏️</span><input id="bed" type="number" min="0" value="2"></div>
      <div class="field"><label>客厅</label><span class="ic">🛋️</span><input id="liv" type="number" min="0" value="1"></div>
      <div class="field"><label>餐厅</label><span class="ic">🍽️</span><input id="din" type="number" min="0" value="1"></div>
      <div class="field"><label>厨房</label><span class="ic">🍳</span><input id="kit" type="number" min="0" value="1"></div>
      <div class="field"><label>卫生间</label><span class="ic">🚿</span><input id="bath" type="number" min="0" value="1"></div>
      <div class="field"><label>建筑面积(㎡)</label><span class="ic">📐</span><input id="area" type="number" min="0" value="100"></div>
    </div>
    <div class="grid" style="margin-top:12px;">
      <div class="field"><label>有没有阳台</label>
        <select id="balcony"><option value="1">有（客厅/卧室阳台）</option><option value="0">没有</option></select></div>
      <div class="field"><label>有没有书房</label>
        <select id="study"><option value="0">没有</option><option value="1">有</option></select></div>
    </div>
  </div>

  <div class="step">
    <h2><span class="n">2</span>勾选你想做的智能模块</h2>
    <div class="mods" id="modBox"></div>
  </div>

  <div class="step">
    <h2><span class="n">3</span>上传户型平面图（可选，更直观）</h2>
    <p class="hint">不上传也照样出清单。上传后，生成结果里可以直接在图上点选、拖拽摆放设备，一图看懂全屋要装啥。</p>
    <div class="upload">
      <label class="file">📷 选择平面图<input type="file" id="planFile" accept="image/*"></label>
      <span class="tip" id="uploadTip">支持 JPG / PNG，图片只在你本机处理，不会上传服务器</span>
    </div>
    <div class="plan-wrap" id="planWrap" style="display:none">
      <div class="plan-canvas" id="planCanvas"><img id="planImg"></div>
      <div class="plan-tools" id="planTools"></div>
      <div class="plan-foot">
        <button id="undoBtn">↩ 撤销</button>
        <button id="clearBtn">🗑 清空</button>
        <span class="count" id="markCount">已放 0 个设备</span>
      </div>
    </div>
  </div>

  <button class="btn" onclick="generate()">生成我的点位清单 →</button>

  <div id="result">
    <div class="empty">填完上面三步，点按钮就能看到你的专属清单和图上标注。</div>
  </div>

  <footer>本工具由「侯哥全屋智能」提供 · 仅作自测参考，落地请以现场勘测方案为准</footer>
</div>

<script>
const RICON={bed:'🛏️',liv:'🛋️',din:'🍽️',kit:'🍳',bath:'🚿',bal:'🌿',study:'📚',entry:'🚪',whole:'🏠'};
const MODS=[
  {k:'switch',n:'智能开关',d:'零火线/双控/多控',c:true},
  {k:'light',n:'智能灯光',d:'情景/调光/起夜',c:true},
  {k:'lock',n:'智能门锁',d:'指纹/人脸/远程'},
  {k:'cam',n:'安防监控',d:'摄像头/燃气/水浸'},
  {k:'curtain',n:'智能窗帘',d:'客厅/卧室自动开合'},
  {k:'voice',n:'语音控制',d:'小艺/小度/天猫'},
  {k:'wifi',n:'全屋 WiFi',d:'AP/网口/弱电箱'},
  {k:'sensor',n:'环境传感器',d:'人体/门磁/烟感'},
  {k:'music',n:'背景音乐',d:'吸顶喇叭/影音'},
  {k:'env',n:'环境监测',d:'温湿度/空气'},
  {k:'ac',n:'空调/中央空调',d:'留位/管孔/排水'},
  {k:'tv',n:'电视/影音',d:'预埋管/藏线'},
  {k:'fresh',n:'新风系统',d:'主机/风管/检修'},
  {k:'water',n:'净水器',d:'厨下/上下水'},
  {k:'robot',n:'扫地机基站',d:'上下水/电源'},
  {k:'hanger',n:'智能晾衣机',d:'吊顶留电/加固'}
];
const TOOLS=MODS.map(m=>m.k);

function iSvg(name){return `<svg class="ico"><use href="#icon-${name}"></use></svg>`;}

// 渲染模块勾选卡片
const modBox=document.getElementById('modBox');
modBox.innerHTML=MODS.map(m=>`
  <label class="mod"><input type="checkbox" class="m" value="${m.k}" ${m.c?'checked':''}>
    <span class="ico">${iSvg(m.k)}</span>
    <span class="txt"><span class="t">${m.n}</span><span class="d">${m.d}</span></span>
    <span class="check"><svg width="12" height="12"><use href="#icon-check"></use></svg></span>
  </label>`).join('');

let planImgData='';
let markers=[];
let activeTool=null;
let dragTarget=null;
const canvas=document.getElementById('planCanvas');

/* ---------- 平面图上传 ---------- */
document.getElementById('planFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    planImgData=ev.target.result;
    document.getElementById('planImg').src=planImgData;
    document.getElementById('planWrap').style.display='block';
    document.getElementById('uploadTip').textContent='已加载 ✓ 生成后可在图上点选摆放设备';
    buildTools();
  };
  r.readAsDataURL(f);
});

function buildTools(){
  const box=document.getElementById('planTools');
  if(box.dataset.built) return;
  let html=MODS.map(m=>`<div class="tool" data-tool="${m.k}">${iSvg(m.k)}${m.n}</div>`).join('');
  html+=`<div class="tool erase" data-tool="erase">${iSvg('erase')}删除</div>`;
  box.innerHTML=html;
  box.dataset.built='1';
  box.querySelectorAll('.tool').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));
      el.classList.add('active'); activeTool=el.dataset.tool;
    });
  });
}

/* 在平面图上点击放置 / 拖拽 */
canvas.addEventListener('pointerdown',e=>{
  if(dragTarget) return;
  if(!activeTool || activeTool==='erase') return;
  const rect=canvas.getBoundingClientRect();
  const x=((e.clientX-rect.left)/rect.width*100);
  const y=((e.clientY-rect.top)/rect.height*100);
  addMarker(activeTool,x,y);
});

function addMarker(mod,x,y){
  if(!planImgData) return;
  markers.push({mod,x:Math.max(0,Math.min(100,x)),y:Math.max(0,Math.min(100,y))});
  renderMarkers();
}
function renderMarkers(){
  canvas.querySelectorAll('.marker').forEach(m=>m.remove());
  markers.forEach((mk,idx)=>{
    const el=document.createElement('div');
    el.className='marker';
    el.style.left=mk.x+'%'; el.style.top=mk.y+'%';
    el.innerHTML=iSvg(mk.mod);
    el.dataset.idx=idx;
    el.addEventListener('pointerdown',ev=>{
      ev.stopPropagation();
      if(activeTool==='erase'){markers.splice(idx,1);renderMarkers();return;}
      dragTarget=el; el.setPointerCapture(ev.pointerId);
      const rect=canvas.getBoundingClientRect();
      const offX=(ev.clientX-rect.left)/rect.width*100-mk.x;
      const offY=(ev.clientY-rect.top)/rect.height*100-mk.y;
      const move=ev2=>{
        if(!dragTarget) return;
        mk.x=Math.max(0,Math.min(100,(ev2.clientX-rect.left)/rect.width*100-offX));
        mk.y=Math.max(0,Math.min(100,(ev2.clientY-rect.top)/rect.height*100-offY));
        el.style.left=mk.x+'%'; el.style.top=mk.y+'%';
      };
      const up=()=>{dragTarget=null;el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);};
      el.addEventListener('pointermove',move);
      el.addEventListener('pointerup',up);
    });
    canvas.appendChild(el);
  });
  document.getElementById('markCount').textContent='已放 '+markers.length+' 个设备';
}
document.getElementById('undoBtn').addEventListener('click',()=>{markers.pop();renderMarkers();});
document.getElementById('clearBtn').addEventListener('click',()=>{markers=[];renderMarkers();});

/* ---------- 户型与清单 ---------- */
function rooms(){
  const n=id=>Math.max(0,parseInt(document.getElementById(id).value)||0);
  const list=[];
  for(let i=0;i<n('bed');i++) list.push({k:'bed',name:(i===0?'主卧':(i===1?'次卧':'卧室'+(i+1))),switch:true,light:true,curtain:true,voice:true,sensor:true,music:true,env:true,ac:true,tv:true});
  for(let i=0;i<n('liv');i++) list.push({k:'liv',name:'客厅',switch:true,light:true,curtain:true,voice:true,sensor:true,music:true,env:true,cam:true,ac:true,tv:true});
  for(let i=0;i<n('din');i++) list.push({k:'din',name:'餐厅',switch:true,light:true,voice:true,wifi:true});
  for(let i=0;i<n('kit');i++) list.push({k:'kit',name:'厨房',switch:true,light:true,wifi:true,cam:true,water:true,robot:true});
  for(let i=0;i<n('bath');i++) list.push({k:'bath',name:(i===0?'主卫':'卫生间'+(i+1)),switch:true,light:true,sensor:true,env:true});
  if(document.getElementById('balcony').value==='1')
    list.push({k:'bal',name:'阳台',switch:true,light:true,curtain:false,sensor:true,wifi:true,cam:true,hanger:true,robot:true});
  if(document.getElementById('study').value==='1')
    list.push({k:'study',name:'书房',switch:true,light:true,voice:true,wifi:true,curtain:true,ac:true});
  return list;
}
function sel(){return [...document.querySelectorAll('.m:checked')].map(c=>c.value);}

function generate(){
  const R=rooms(), S=new Set(sel());
  const out=document.getElementById('result');
  if(R.length===0){out.innerHTML='<div class="empty">户型数量不能为 0，至少填一个房间。</div>';return;}
  if(S.size===0){out.innerHTML='<div class="empty">至少勾选一个智能模块。</div>';return;}

  let total=0, early=0;
  const items={};
  const add=(room,mod,text,stage,meta)=>{
    items[room]=items[room]||[];
    items[room].push({mod,text,stage,meta});
    total++; if(stage==='early') early++;
  };

  R.forEach(r=>{
    if(S.has('switch')&&r.switch){
      if(r.k==='bed'){
        add(r.name,'switch','床头/门口双控智能开关','early','水电阶段必留零线');
        add(r.name,'switch','主卧情景面板/无线开关','any','后期可贴墙上，不用开槽');
      }else if(r.k==='liv'){
        add(r.name,'switch','客厅主灯/氛围灯智能开关 + 情景面板','early','开关底盒留零线，水电阶段定');
      }else if(r.k==='kit'){
        add(r.name,'switch','厨房智能开关（留零线）','early','防油烟建议用面板');
      }else if(r.k==='bath'){
        add(r.name,'switch','卫生间智能开关 + 镜前灯开关','early','干区留零线，浴室外控制');
      }else{
        add(r.name,'switch','智能开关零火线预留 + 双控','early','水电阶段');
      }
    }
    if(S.has('light')&&r.light){
      if(r.k==='bed'){
        add(r.name,'light','主灯位 + 灯带/灯槽预留','early','氛围光必留槽位');
        add(r.name,'sensor','起夜感应灯（人体存在传感器联动）','any','不弯腰不摸黑，后期可补');
      }else if(r.k==='liv'){
        add(r.name,'light','主灯位 + 氛围灯带 + 电视墙灯位','early','无主灯需提前分组');
        add(r.name,'light','磁吸轨/筒灯分区控制点位','early','吊顶前定方案');
      }else if(r.k==='kit'){
        add(r.name,'light','厨房主灯 + 吊柜下感应灯带','early','切菜不背光');
      }else if(r.k==='bath'){
        add(r.name,'light','卫生间主灯 + 镜前灯/起夜灯','early','镜柜灯单独留线');
      }else{
        add(r.name,'light','主灯位 + 氛围灯位','early','水电阶段');
      }
    }
    if(S.has('cam')&&r.cam){
      add(r.name,'cam','摄像头电源 + 网口（POE 优先）','early','水电阶段留好，后期不用飞线');
    }
    if(S.has('curtain')&&r.curtain){
      add(r.name,'curtain','窗帘盒旁预留电源','early','电机用，窗帘盒净宽≥15cm');
      add(r.name,'curtain','确认电机尺寸与帘盒深度','early','木工吊顶前');
    }
    if(S.has('voice')&&r.voice){
      add(r.name,'voice','语音音箱/面板电源点位','early','先定平台：华为/小米/涂鸦不互通');
    }
    if(S.has('wifi')&&r.wifi){
      add(r.name,'wifi','预留超六类网口','early','AP 或有线回程用');
    }
    if(S.has('sensor')&&r.sensor){
      if(r.k==='bed') add(r.name,'sensor','人体存在传感器（起夜/睡眠场景）','any','后期可加');
      if(r.k==='liv'||r.k==='bal') add(r.name,'sensor','人体 + 门窗门磁（回家/布防场景）','any','后期可加');
      if(r.k==='kit') add(r.name,'sensor','烟雾报警器','any','后期可加');
    }
    if(S.has('music')&&r.music){
      add(r.name,'music','吸顶喇叭点位 + 功放位置','early','吊顶前定，留音频线');
    }
    if(S.has('env')&&r.env){
      add(r.name,'env','温湿度/PM2.5 传感器','any','联动新风/空调，后期可加');
    }
    if(S.has('ac')&&r.ac){
      if(r.k==='liv'){
        add(r.name,'ac','中央空调/风管机电源 + 穿墙管孔 + 冷凝水排水位','early','吊顶水电前定，外机位提前留');
        add(r.name,'ac','客厅柜机/挂机 16A 专用插座','early','别和普通插座共用回路');
      }else if(r.k==='bed'){
        add(r.name,'ac','卧室空调 16A 插座 + 穿墙孔 + 冷凝水排位','early','内机避开床头直吹、避开梁');
      }else if(r.k==='study'){
        add(r.name,'ac','书房空调 16A 插座 + 穿墙孔','early','水电阶段');
      }
    }
    if(S.has('tv')&&r.tv){
      add(r.name,'tv','电视墙预埋 50 管（藏线）+ 隐藏插座 + 网口','early','木工前定，不然明线丑到没法看');
    }
    if(S.has('water')&&r.water){
      add(r.name,'water','厨下净水器插座 + 排水 + 前置过滤器位','early','留 10A 带开关插座，靠近冷水角阀');
    }
    if(S.has('robot')&&r.robot){
      add(r.name,'robot','扫地机基站上下水 + 电源','early','阳台/厨房留冷热水+排水，免天天倒水');
    }
    if(S.has('hanger')&&r.hanger){
      add(r.name,'hanger','智能晾衣机电源 + 吊顶称重加固','early','晾衣机重，石膏板顶要加吊杆');
    }
  });

  // 全屋/入户级点位：仅生成一次
  if(S.has('lock')) add('入户','lock','智能门锁（替换机械锁）','early','确认门厚/导向片/锁体，提前买锁让师傅开孔');
  if(S.has('cam')){
    add('厨房','cam','燃气传感器 + 机械手','any','泄漏自动关阀，联动推消息');
    R.filter(r=>r.k==='bath').forEach(r=>add(r.name,'cam','水浸传感器（溢水报警）','any','出差也不怕'));
  }
  if(S.has('wifi')) add('全屋','wifi','弱电箱换大 + 光猫/路由器/AC 规划','early','光猫塞不下是 90% 家庭的痛');
  if(S.has('fresh')) add('全屋','fresh','新风主机电源 + 风管走位 + 检修口','early','与中央空调/梁位冲突多，开工前二者方案并图');

  const roomOrder=['入户','主卧','次卧','卧室3','卧室4','客厅','餐厅','厨房','主卫','卫生间2','卫生间3','阳台','书房','全屋'];
  const orderedKeys=Object.keys(items).sort((a,b)=>{
    const ia=roomOrder.indexOf(a), ib=roomOrder.indexOf(b);
    return (ia===-1?999:ia)-(ib===-1?999:ib);
  });

  /* 平面图标注结果区（若有图） */
  let planHtml='';
  if(planImgData){
    const summary={};
    markers.forEach(m=>summary[m.mod]=(summary[m.mod]||0)+1);
    const legend=Object.keys(summary).length
      ? Object.keys(summary).map(m=>`<div class="tool" style="cursor:default">${iSvg(MODS.find(x=>x.k===m)?.k||m)}${MODS.find(x=>x.k===m)?.n||m} ×${summary[m]}</div>`).join('')
      : `<span class="tip">还没有放置设备，用下方工具栏在图上点选试试 👇</span>`;
    planHtml=`<div class="plan-result">
      <h3>🗺️ 你的户型设备标注</h3>
      <p class="ph">在平面图上点选设备放置，可拖拽调整位置，选中「删除」点图标移除。右侧/下方清单与图同步。</p>
      <div class="plan-wrap" style="margin-top:10px">
        <div class="plan-canvas" id="planCanvas2"><img src="${planImgData}"></div>
        <div class="plan-tools" id="planTools2">${document.getElementById('planTools').innerHTML}</div>
        <div class="plan-foot">
          <button id="undoBtn2">↩ 撤销</button>
          <button id="clearBtn2">🗑 清空</button>
          <span class="count" id="markCount2">已放 ${markers.length} 个设备</span>
        </div>
      </div>
      <div class="plan-tools" id="legend2" style="border:none;padding:12px 0 0">${legend}</div>
    </div>`;
  }

  const summaryHtml=`<div class="summary">
    <div class="summary-top">
      <div class="cell"><span class="num">${R.length}</span><span class="lab">空间数</span></div>
      <div class="cell"><span class="num">${S.size}</span><span class="lab">智能模块</span></div>
      <div class="cell"><span class="num">${total}</span><span class="lab">点位建议</span></div>
      <div class="cell"><span class="num">${early}</span><span class="lab">水电前必做</span></div>
    </div>
    <div class="summary-bars">
      <div class="bar-row"><span>水电前必做</span><div class="bar"><i style="width:0%" data-w="${Math.round(early/total*100)}"></i></div><div class="val">${Math.round(early/total*100)}%</div></div>
      <div class="bar-row"><span>后期可补</span><div class="bar"><i style="width:0%" data-w="${Math.round((total-early)/total*100)}"></i></div><div class="val">${Math.round((total-early)/total*100)}%</div></div>
    </div>
  </div>`;

  const roomHtml=orderedKeys.map((room,idx)=>{
    const its=items[room];
    const icon=RICON[room]||'🏠';
    const lis=its.map((it,i)=>`
      <div class="item" style="animation-delay:${i*40}ms">
        <div class="i-ico">${iSvg(it.mod)}</div>
        <div class="txt"><b>${it.text}</b><div class="sub">${it.meta}</div></div>
        <span class="tag ${it.stage==='early'?'early':'any'}">${it.stage==='early'?'⚠ 水电前':'✓ 后期可补'}</span>
      </div>`).join('');
    return `<div class="room" style="animation-delay:${idx*80}ms"><h3><span class="ric">${icon}</span>${room}<span class="count">${its.length} 项</span></h3>${lis}</div>`;
  }).join('');

  const pits=[];
  if(S.has('switch')) pits.push({i:'⚡',t:'所有开关底盒必须留零线——智能开关靠零线供电，没留只能买带电容的贵款或改造，费钱。'});
  if(S.has('lock')) pits.push({i:'🚪',t:'先确认小区是否允许换锁体/保留机械钥匙；选支持你门型的锁，别等装门了才发现开不了孔。'});
  if(S.has('cam')) pits.push({i:'📹',t:'摄像头别对着邻居家门窗和自家卧室，隐私合规也避免邻里纠纷。'});
  if(S.has('curtain')) pits.push({i:'🪟',t:'窗帘盒净宽留够，电机+帘布一般要 15cm 以上，做窄了拉不严。'});
  if(S.has('voice')) pits.push({i:'🎙️',t:'华为/小米/涂鸦/Aqara 阵营不互通，先定一个主平台，再买设备，否则不能联动。'});
  if(S.has('wifi')) pits.push({i:'📶',t:'弱电箱太小是 90% 家庭的痛，早点换大；每个房间留网口，WiFi 再强也不如网线稳。'});
  if(S.has('ac')) pits.push({i:'❄️',t:'空调内机别对着床头直吹，穿墙孔和外机位一定要在水电阶段定，不然打不了孔、冷凝水没处排。'});
  if(S.has('tv')) pits.push({i:'📺',t:'电视墙不预埋 50 管，后期电线全露外面，丑到没法看；幕布/投影也要提前留电。'});
  if(S.has('fresh')) pits.push({i:'🌬️',t:'新风和中央空调共用吊顶，走管打架是常态，必须在水电开工前把二者方案并图。'});
  if(S.has('robot')) pits.push({i:'🤖',t:'扫地机基站想接上下水，必须在水电阶段留冷热水和排水口，后期再改要砸台面。'});
  if(S.has('hanger')) pits.push({i:'👔',t:'智能晾衣机自重不轻，石膏板/铝扣板顶要提前加吊杆加固，否则用久了下坠。'});
  if(S.has('water')) pits.push({i:'💧',t:'净水器要留带开关的 10A 插座 + 排水，前置过滤器装在总进水处，别等贴完砖才想起来。'});
  pits.push({i:'🏠',t:'以上清单只是「自测版」，实际点位要根据你家墙体、梁位、家具布局现场定——尤其是零火线和新风/中央空调走线冲突时。'});

  out.innerHTML=planHtml+summaryHtml+roomHtml+
    `<div class="pit"><h3>${iSvg('warn')} 侯哥的避坑提醒（开工前必看）</h3>${pits.map(p=>`<div class="pit-row"><span class="p-ico">${p.i}</span><span class="p-txt">${p.t}</span></div>`).join('')}</div>`+
    `<div class="actions">
      <button class="primary" onclick="window.print()">导出 / 打印 PDF</button>
      <button onclick="copyText()">复制清单文本</button>
      <button onclick="sharePlan()" style="border-color:var(--brand2);color:var(--brand2)">📤 分享给侯哥</button>
    </div>`+
    `<div class="hook">
      <h3>这份清单只是起点</h3>
      <p>点位留错一个，后期加装的人工+材料可能比你想象贵好几倍。</p>

function bindResultPlan(){
  const c2=document.getElementById('planCanvas2');
  if(!c2) return;
  markers.forEach((mk,idx)=>{
    const el=document.createElement('div');
    el.className='marker'; el.style.left=mk.x+'%'; el.style.top=mk.y+'%';
    el.innerHTML=iSvg(mk.mod); el.dataset.idx=idx;
    c2.appendChild(el);
  });
  let active2=document.getElementById('planTools2').querySelector('.tool.active')?.dataset.tool || null;
  document.getElementById('planTools2').querySelectorAll('.tool').forEach(el=>{
    el.addEventListener('click',()=>{
      document.getElementById('planTools2').querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));
      el.classList.add('active'); active2=el.dataset.tool;
      document.getElementById('planTools').querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));
      const up=document.getElementById('planTools').querySelector(`.tool[data-tool="${el.dataset.tool}"]`);
      if(up) up.classList.add('active');
      activeTool=el.dataset.tool;
    });
  });
  c2.addEventListener('pointerdown',e=>{
    if(active2==='erase') return;
    if(!active2) return;
    const rect=c2.getBoundingClientRect();
    const x=Math.max(0,Math.min(100,(e.clientX-rect.left)/rect.width*100));
    const y=Math.max(0,Math.min(100,(e.clientY-rect.top)/rect.height*100));
    markers.push({mod:active2,x,y}); renderBoth();
  });
  document.getElementById('undoBtn2').addEventListener('click',()=>{markers.pop();renderBoth();});
  document.getElementById('clearBtn2').addEventListener('click',()=>{markers=[];renderBoth();});
}
function renderBoth(){
  renderMarkers();
  const c2=document.getElementById('planCanvas2');
  if(c2){c2.querySelectorAll('.marker').forEach(m=>m.remove());
    markers.forEach((mk,idx)=>{const el=document.createElement('div');el.className='marker';
      el.style.left=mk.x+'%';el.style.top=mk.y+'%';el.innerHTML=iSvg(mk.mod);c2.appendChild(el);});}
  document.getElementById('markCount').textContent='已放 '+markers.length+' 个设备';
  const mc2=document.getElementById('markCount2'); if(mc2) mc2.textContent='已放 '+markers.length+' 个设备';
  const leg2=document.getElementById('legend2');
  if(leg2){
    const summary={};
    markers.forEach(m=>summary[m.mod]=(summary[m.mod]||0)+1);
    leg2.innerHTML=Object.keys(summary).length
      ? Object.keys(summary).map(m=>`<div class="tool" style="cursor:default">${iSvg(MODS.find(x=>x.k===m)?.k||m)}${MODS.find(x=>x.k===m)?.n||m} ×${summary[m]}</div>`).join('')
      : `<span class="tip">还没有放置设备，用下方工具栏在图上点选试试 👇</span>`;
  }
}

function copyText(){
  const t=document.getElementById('result').innerText;
  navigator.clipboard.writeText(t).then(()=>alert('清单已复制，可粘贴到微信发给侯哥或自己留存。'));
}

function val(id){return document.getElementById(id).value;}

/* 一键分享：把户型+模块+图上标注编码成链接/摘要，发给侯哥 */
function sharePlan(){
  const st={
    bed:val('bed'), liv:val('liv'), din:val('din'), kit:val('kit'), bath:val('bath'),
    area:val('area'), balcony:document.getElementById('balcony').value,
    study:document.getElementById('study').value,
    mods:sel(),
    markers:markers.map(m=>({mod:m.mod, x:+m.x.toFixed(1), y:+m.y.toFixed(1)}))
  };
  const enc=btoa(unescape(encodeURIComponent(JSON.stringify(st))));
  // 未部署（本地打开）时，分享链接对方打不开，退化为「配置摘要」方便客户直接发微信
  if(location.protocol==='file:'){
    const nameOf=k=>MODS.find(m=>m.k===k)?.n||k;
    const txt=`【侯哥帮我看户型】\n户型：${st.bed}室${st.liv}厅${st.din}餐${st.kit}厨${st.bath}卫，面积约${st.area}㎡`+
      (document.getElementById('balcony').value==='1'?'，有阳台':'')+(document.getElementById('study').value==='1'?'，有书房':'')+
      `\n想做：${st.mods.map(nameOf).join('、')||'（未勾选）'}\n图上已标 ${st.markers.length} 处设备`+
      `\n请帮我把关点位，谢谢侯哥！`;
    navigator.clipboard.writeText(txt).then(()=>alert('已复制你的配置摘要，直接发给「侯哥全屋智能」微信即可，我帮你人工把关。\n\n（工具上线后这里会自动生成可点开的方案链接）'));
    return;
  }
  const url=location.origin+location.pathname+'#s='+enc;
  navigator.clipboard.writeText(url).then(()=>alert('方案链接已复制！发到微信给「侯哥全屋智能」，我打开就能看到你家的完整配置，不用你重填。'));
}

/* 打开他人分享的链接时，自动还原配置并生成 */
function applyState(st){
  const set=(id,v)=>{const e=document.getElementById(id); if(e&&v!=null) e.value=v;};
  set('bed',st.bed); set('liv',st.liv); set('din',st.din); set('kit',st.kit); set('bath',st.bath); set('area',st.area);
  set('balcony',st.balcony); set('study',st.study);
  document.querySelectorAll('.m').forEach(c=>c.checked=Array.isArray(st.mods)&&st.mods.includes(c.value));
  markers=Array.isArray(st.markers)?st.markers.slice():[];
}
window.addEventListener('load',()=>{
  if(location.hash && location.hash.indexOf('#s=')===0){
    try{
      const json=decodeURIComponent(escape(atob(location.hash.slice(3))));
      applyState(JSON.parse(json));
      generate();
      history.replaceState(null,'',location.pathname);
      window.scrollTo({top:document.getElementById('result').offsetTop,behavior:'smooth'});
    }catch(e){ console.warn('分享链接解析失败',e); }
  }
});
